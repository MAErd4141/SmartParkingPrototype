spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akilli_otopark}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create   # 🟢 ŞİMDİLİK create (schema sıfırladık ya)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

server:
  port: 8080

app:
  qr:
    secret: ${APP_QR_SECRET:super-secret-key-buraya-bir-sey-yaz}
    ttl-minutes: ${APP_QR_TTL_MINUTES:30}

  jwt:
    secret: ${APP_JWT_SECRET:super-gizli-jwt-key-buraya-bir-sey-yaz}
    expiration-minutes: 60