<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Akıllı Otopark - Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-stat { border: none; border-radius: 15px; color: white; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        .bg-primary-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-success-gradient { background: linear-gradient(135deg, #2af598 0%, #009efd 100%); }
        .bg-warning-gradient { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); color: #333; }
        .bg-danger-gradient { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #333; }
        #map { height: 350px; width: 100%; border-radius: 12px; border: 2px solid #e9ecef; }
        .action-btn { cursor: pointer; }
    </style>
</head>
<body>

<div id="login-wrapper">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 shadow-lg border-0" style="width: 450px; border-radius: 20px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-square-parking fa-4x text-primary"></i>
                <h3 class="mt-3 fw-bold">Yönetici Girişi</h3>
            </div>
            <form onsubmit="event.preventDefault(); login()">
                <div class="form-floating mb-3">
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                    <label>E-Posta Adresi</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <label>Şifre</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">Giriş Yap</button>
            </form>
            <p id="msg" class="text-danger mt-3 text-center fw-bold"></p>
        </div>
    </div>
</div>

<div id="dashboard-container" class="container mt-5 mb-5" style="display: none;">

    <div class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 rounded-4 shadow-sm">
        <div class="d-flex align-items-center">
            <i class="fa-solid fa-shield-halved fa-2x text-primary me-3"></i>
            <div>
                <h2 class="m-0 fw-bold">Yönetim Paneli</h2>
                <small class="text-muted">Akıllı Otopark Sistemi v1.0</small>
            </div>
        </div>
        <button onclick="logout()" class="btn btn-danger rounded-pill px-4"><i class="fa-solid fa-right-from-bracket me-2"></i>Çıkış</button>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-3"><div class="card card-stat bg-primary-gradient p-4"><h5><i class="fa-solid fa-users me-2"></i>Kullanıcılar</h5><h1 id="totalUsers" class="fw-bold display-4">0</h1></div></div>
        <div class="col-md-3"><div class="card card-stat bg-success-gradient p-4"><h5><i class="fa-solid fa-sack-dollar me-2"></i>Toplam Ciro</h5><h1 id="totalRevenue" class="fw-bold display-4">0 ₺</h1></div></div>
        <div class="col-md-3"><div class="card card-stat bg-warning-gradient p-4"><h5><i class="fa-solid fa-square-parking me-2"></i>Otoparklar</h5><h1 id="totalLots" class="fw-bold display-4">0</h1></div></div>
        <div class="col-md-3"><div class="card card-stat bg-danger-gradient p-4"><h5><i class="fa-solid fa-ticket me-2"></i>Bugünkü İşlem</h5><h1 id="todaysReservations" class="fw-bold display-4">0</h1></div></div>
    </div>

    <div class="row">

        <div class="col-lg-7">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h5 class="fw-bold text-primary"><i class="fa-solid fa-location-dot me-2"></i>Yeni Otopark Ekle</h5>
                </div>
                <div class="card-body p-4">
                    <form id="addLotForm">
                        <div class="row g-3">
                            <div class="col-md-6"><input type="text" id="lotName" class="form-control" placeholder="Otopark Adı" required></div>
                            <div class="col-md-6"><input type="text" id="lotCode" class="form-control" placeholder="Kod (TR-34-XX)" required></div>
                            <div class="col-md-6"><input type="number" id="lotPrice" class="form-control" placeholder="Saatlik Ücret (TL)" required></div>
                            <div class="col-md-6"><input type="number" id="lotCapacity" class="form-control" value="10" placeholder="Kapasite"></div>
                            <div class="col-12"><input type="text" id="lotAddress" class="form-control" placeholder="Adres"></div>

                            <div class="col-12">
                                <label class="form-label small text-muted">Konumu haritadan seçin:</label>
                                <div id="map"></div>
                            </div>
                            <div class="col-6"><input type="text" id="lotLat" class="form-control form-control-sm" readonly></div>
                            <div class="col-6"><input type="text" id="lotLng" class="form-control form-control-sm" readonly></div>

                            <input type="hidden" id="lotProvince" value="Istanbul">
                            <input type="hidden" id="lotDistrict" value="Merkez">

                            <div class="col-12 text-end mt-3">
                                <button type="button" onclick="addParkingLot()" class="btn btn-success px-5 rounded-pill fw-bold">
                                    <i class="fa-solid fa-plus me-2"></i>Oluştur
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold text-danger"><i class="fa-solid fa-user-gear me-2"></i>Kullanıcı Yönetimi</h5>
                    <button onclick="loadUsers()" class="btn btn-sm btn-light"><i class="fa-solid fa-rotate"></i></button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive" style="max-height: 600px;">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light sticky-top">
                            <tr>
                                <th class="ps-4">Ad Soyad</th>
                                <th>Rol</th>
                                <th class="text-end pe-4">İşlem</th>
                            </tr>
                            </thead>
                            <tbody id="userTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_URL = "http://localhost:8080/api";
    let map, marker;

    // --- HARİTA ---
    function initMap() {
        const startLat = 41.0082, startLng = 28.9784;
        map = L.map('map').setView([startLat, startLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([startLat, startLng], {draggable: true}).addTo(map);
        updateInputs(startLat, startLng);

        marker.on('dragend', function (e) { updateInputs(e.target.getLatLng().lat, e.target.getLatLng().lng); });
        map.on('click', function(e) { marker.setLatLng(e.latlng); updateInputs(e.latlng.lat, e.latlng.lng); });
    }
    function updateInputs(lat, lng) {
        document.getElementById('lotLat').value = lat.toFixed(6);
        document.getElementById('lotLng').value = lng.toFixed(6);
    }

    // --- GİRİŞ ---
    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({email, password})
            });
            if(res.ok) {
                const data = await res.json();
                localStorage.setItem("token", data.token);
                loadDashboard();
            } else { document.getElementById("msg").innerText = "Giriş Başarısız!"; }
        } catch(e) { alert("Sunucu Hatası!"); }
    }

    // --- DASHBOARD VERİLERİ ---
    async function loadDashboard() {
        const token = localStorage.getItem("token");
        if(!token) return;

        const res = await fetch(`${API_URL}/admin/dashboard`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if(res.ok) {
            const data = await res.json();

            // Bootstrap çakışmasını önlemek için classlist kullanıyoruz
            document.getElementById("login-wrapper").classList.add("d-none");
            document.getElementById("dashboard-container").style.display = "block";

            document.getElementById("totalUsers").innerText = data.totalUsers;
            document.getElementById("totalRevenue").innerText = data.totalRevenue + " ₺";
            document.getElementById("totalLots").innerText = data.totalLots;
            document.getElementById("todaysReservations").innerText = data.todaysReservations;

            // Haritayı ve Kullanıcıları Yükle
            setTimeout(() => { if(!map) initMap(); else map.invalidateSize(); }, 200);
            loadUsers();
        } else { logout(); }
    }

    // --- KULLANICI LİSTESİ ---
    async function loadUsers() {
        const token = localStorage.getItem("token");
        const res = await fetch(`${API_URL}/users`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        if(res.ok) {
            const users = await res.json();
            const tbody = document.getElementById("userTableBody");
            tbody.innerHTML = "";
            users.forEach(user => {
                const badge = user.role === 'ADMIN' ? 'bg-danger' : 'bg-secondary';
                const row = `
                    <tr>
                        <td class="ps-4">
                            <div class="fw-bold">${user.fullName}</div>
                            <div class="small text-muted">${user.email}</div>
                        </td>
                        <td><span class="badge ${badge}">${user.role}</span></td>
                        <td class="text-end pe-4">
                            ${user.role !== 'ADMIN' ?
                            `<button onclick="deleteUser('${user.id}')" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>`
                            : ''}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
    }

    // --- KULLANICI SİL ---
    async function deleteUser(id) {
        if(!confirm("Bu kullanıcıyı ve TÜM verilerini silmek istediğinize emin misiniz?")) return;

        const token = localStorage.getItem("token");
        const res = await fetch(`${API_URL}/users/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });
        if(res.ok) { loadUsers(); loadStats(); } // Listeyi ve istatistikleri yenile
        else alert("Silinemedi!");
    }

    // --- OTOPARK EKLE ---
    async function addParkingLot() {
        const token = localStorage.getItem("token");
        const payload = {
            name: document.getElementById("lotName").value,
            code: document.getElementById("lotCode").value,
            hourlyRate: parseFloat(document.getElementById("lotPrice").value),
            capacity: parseInt(document.getElementById("lotCapacity").value),
            province: "Istanbul", // Basitlik için sabit
            district: "Merkez",
            address: document.getElementById("lotAddress").value,
            latitude: parseFloat(document.getElementById("lotLat").value),
            longitude: parseFloat(document.getElementById("lotLng").value)
        };

        if(!payload.name || !payload.code) { alert("Zorunlu alanları doldurun!"); return; }

        try {
            const res = await fetch(`${API_URL}/parking-lots`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                alert("✅ Otopark Eklendi!");
                document.getElementById("addLotForm").reset();
                // Sayfayı komple yenilemeye gerek yok, sadece statları güncelle
                const statsRes = await fetch(`${API_URL}/admin/dashboard`, { headers: { "Authorization": `Bearer ${token}` }});
                if(statsRes.ok) {
                    const data = await statsRes.json();
                    document.getElementById("totalLots").innerText = data.totalLots;
                }
            } else {
                const err = await res.json();
                alert("Hata: " + err.message);
            }
        } catch(e) { alert("Hata!"); }
    }

    function logout() { localStorage.removeItem("token"); location.reload(); }

    // Başlangıç Kontrolü
    if(localStorage.getItem("token")) loadDashboard();
</script>

</body>
</html>
